---
# Dynamic plugins configuration for Red Hat Developer Hub.
# Uses the default plugin set bundled with the RHDH image.
# Specific plugins will be enabled here once correct package references
# are confirmed for this RHDH version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: developer-hub
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # ── Keycloak catalog sync ──────────────────────────────────────────────
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false

      # ── Kubernetes (required by Tekton) ───────────────────────────────────
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false

      # ── ArgoCD ────────────────────────────────────────────────────────────
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.49.4__1.4.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.0
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-argocd:
                translationResources:
                  - importName: argocdTranslations
                    module: Alpha
                    ref: argocdTranslationRef
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: ArgocdDeploymentSummary
                    config:
                      layout:
                        gridColumnEnd:
                          lg: span 8
                          xs: span 12
                      if:
                        allOf:
                          - isArgocdConfigured
                  - mountPoint: entity.page.cd/cards
                    importName: ArgocdDeploymentLifecycle
                    config:
                      layout:
                        gridColumn: 1 / -1
                      if:
                        allOf:
                          - isArgocdConfigured

      # ── Metering (cost tracking) ──────────────────────────────────────────
      # TODO: Replace <your-org> with your Quay.io org and push the OCI image first.
      # Build commands:
      #   cd plugins && ./export-dev.sh
      #   npx @red-hat-developer-hub/cli@1.10 plugin package \
      #     --tag quay.io/<your-org>/rhdh-plugin-metering-backend:1.0.0 \
      #     --directory plugins/metering-backend/dist-dynamic
      #   podman push quay.io/<your-org>/rhdh-plugin-metering-backend:1.0.0
      # (repeat for plugins/metering/dist-dynamic)
      - package: oci://quay.io/<your-org>/rhdh-plugin-metering-backend:1.0.0
        disabled: true  # Enable after pushing OCI image

      - package: oci://quay.io/<your-org>/rhdh-plugin-metering:1.0.0
        disabled: true  # Enable after pushing OCI image
        pluginConfig:
          dynamicPlugins:
            frontend:
              internal.backstage-plugin-metering:
                apiFactories:
                  # Registers meteringApiRef — required because this plugin is
                  # wired via legacy mountPoints, so createFrontendPlugin's
                  # ApiBlueprint extensions are never processed by the app.
                  - importName: meteringApiFactory
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: MeteringSummaryCard
                    config:
                      layout:
                        gridColumnEnd:
                          lg: span 4
                          md: span 6
                          xs: span 12
                  - mountPoint: entity.page.metering/cards
                    importName: MeteringTabContent
                    config:
                      layout:
                        gridColumn: 1 / -1
                entityTabs:
                  - path: /metering
                    title: Metering
                    mountPoint: entity.page.metering


      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.49.4__3.37.0
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                translationResources:
                  - importName: tektonTranslations
                    ref: tektonTranslationRef
                mountPoints:
                  - mountPoint: entity.page.ci/cards
                    importName: TektonCI
                    config:
                      layout:
                        gridColumn: 1 / -1
                      if:
                        allOf:
                          - isTektonCIAvailable
