---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: developer-hub
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub

    backend:
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: "${BACKEND_SECRET}"

    signInPage: oidc

    integrations:
      github:
        - host: github.com

    auth:
      environment: production
      session:
        secret: "${SESSION_SECRET}"
      providers:
        oidc:
          production:
            metadataUrl: "${KEYCLOAK_BASE_URL}/.well-known/openid-configuration"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
                - resolver: emailMatchingUserEntityProfileEmail

    argocd:
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: default
              url: "${ARGOCD_INSTANCE1_URL}"
              username: "${ARGOCD_USERNAME}"
              password: "${ARGOCD_PASSWORD}"

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: "${K8S_CLUSTER_NAME}"
              url: "${K8S_CLUSTER_URL}"
              authProvider: serviceAccount
              skipTLSVerify: true
              caData: "${K8S_CLUSTER_CA}"
              serviceAccountToken: "${K8S_SERVICE_ACCOUNT_TOKEN}"
      customResources:
        - group: 'tekton.dev'
          apiVersion: 'v1'
          plural: 'pipelineruns'
        - group: 'tekton.dev'
          apiVersion: 'v1'
          plural: 'taskruns'

    metering:
      prometheusUrl: https://prometheus-k8s.openshift-monitoring.svc:9091
      bearerToken: "${METERING_PROMETHEUS_TOKEN}"
      # chargeMode controls which resource signal is billed.
      # Options: usage | requests | limits | max (default: max)
      # max = higher of actual usage vs requests, discourages over-requesting.
      chargeMode: max
      windowHours: 24
      retentionDays: 90
      costModel:
        # Tune these rates to match your cloud or on-prem cost model (USD per unit per hour)
        cpuCostPerCorePerHour: 0.048
        memoryCostPerGBPerHour: 0.006
        # Set gpuCostPerGpuPerHour > 0 only when GPU nodes run DCGM Exporter.
        # Example: 2.48 for an AWS p3.2xlarge V100 GPU fraction.
        gpuCostPerGpuPerHour: 0

    catalog:
      locations:
        - type: url
          target: https://github.com/Babas10/developer-hub-env/blob/main/catalog/demo-stopwatch.yaml
          rules:
            - allow: [Component]
        - type: url
          target: https://github.com/Babas10/developer-hub-env/blob/main/catalog/demo-todo.yaml
          rules:
            - allow: [Component]
        - type: url
          target: https://github.com/Babas10/developer-hub-env/blob/main/catalog/resource-burner.yaml
          rules:
            - allow: [Component]
      providers:
        keycloakOrg:
          default:
            # Internal K8s service URL — server-to-server, always the same across clusters.
            baseUrl: "http://rhdh-keycloak-service.keycloak.svc.cluster.local:8080"
            loginRealm: rhdh
            realm: rhdh
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }
              initialDelay: { seconds: 30 }

