---
# ClusterRoleBinding: grants the RHDH service account read access to
# OpenShift cluster monitoring (Prometheus) so the metering backend
# plugin can query CPU and memory metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhdh-cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: developer-hub-developer-hub
    namespace: developer-hub
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
