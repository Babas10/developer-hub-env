---
# CatalogSource for RHDH on OpenShift 4.22+ (OLM v1 environment).
# On OLM v1 clusters the default redhat-operators CatalogSource no longer exposes 'rhdh'.
# This CatalogSource uses the production Red Hat operator index for OCP 4.22 which does.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: rhdh-fast-ci
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: registry.redhat.io/redhat/redhat-operator-index:v4.22
  displayName: Red Hat Operators (v4.22)
  publisher: Red Hat
  updateStrategy:
    registryPoll:
      interval: 10m
