---
# Generated by post-install.yml — do not edit manually.
# Cluster-specific baseUrl is derived from the cluster API URL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-demo-config
  namespace: backstage-demo
data:
  app-config.production.yaml: |
    app:
      baseUrl: https://backstage-demo-backstage-demo.apps.ocp.tl7lr.sandbox1322.opentlc.com

    backend:
      baseUrl: https://backstage-demo-backstage-demo.apps.ocp.tl7lr.sandbox1322.opentlc.com
      database:
        client: better-sqlite3
        connection: ':memory:'
      auth:
        # Disable backend auth enforcement for demo — lets the
        # frontend call APIs without a fully configured token pipeline.
        dangerouslyDisableDefaultAuthPolicy: true

    auth:
      # dangerouslyAllowOutsideDevelopment is required for the guest
      # provider to issue tokens outside of localhost. Without it,
      # all catalog API calls return 401 Unauthorized.
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    # Metering plugin — prometheusUrl is required by the plugin schema.
    metering:
      prometheusUrl: https://prometheus-k8s.openshift-monitoring.svc:9091
      chargeMode: max
      windowHours: 24
      retentionDays: 90
      rollupAfterDays: 30
      costModel:
        cpuCostPerCorePerHour: 0.048
        memoryCostPerGBPerHour: 0.006
        gpuCostPerGpuPerHour: 0
