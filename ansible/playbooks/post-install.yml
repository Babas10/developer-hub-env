---
# Post-install playbook — runs AFTER ArgoCD has fully synced all waves.
# Responsibilities:
#   1. Create Keycloak users via admin API
#      (RHBK v26 operator does not support user imports via KeycloakRealmImport)
#
# Note: KEYCLOAK_BASE_URL is handled by bootstrap.yml (written to git as a
# ConfigMap and synced by ArgoCD on first deployment).
#
# Usage:
#   ansible-playbook ansible/playbooks/post-install.yml \
#     --vault-password-file ansible/vault_pass \
#     -e ocp_api_url=$OCP_API \
#     -e ocp_token=$(oc whoami --show-token)

- name: Post-install configuration for Developer Hub
  hosts: localhost
  gather_facts: false

  vars:
    ocp_api_url: "{{ lookup('env', 'OCP_API') }}"
    ocp_token: ""
    # Derive OAuth server URL from API URL
    ocp_oauth_url: "{{ ocp_api_url | regex_replace('https://api\\.(.+?):\\d+$', 'https://oauth-openshift.apps.\\1') }}"

    keycloak_users:
      - username: admin
        password: "{{ keycloak_admin_password }}"
        firstName: Admin
        lastName: User
        email: admin@developer-hub.local
        roles:
          - developer-hub-admin
          - developer-hub-user
      - username: developer1
        password: "{{ keycloak_developer_password }}"
        firstName: Developer
        lastName: One
        email: developer1@developer-hub.local
        roles:
          - developer-hub-user
      - username: developer2
        password: "{{ keycloak_developer_password }}"
        firstName: Developer
        lastName: Two
        email: developer2@developer-hub.local
        roles:
          - developer-hub-user

  tasks:
    # -------------------------------------------------------------------------
    # Authenticate — OAuth flow or pre-existing token
    # -------------------------------------------------------------------------
    - name: Request OpenShift OAuth token
      ansible.builtin.uri:
        url: "{{ ocp_oauth_url }}/oauth/authorize?response_type=token&client_id=openshift-challenging-client"
        method: GET
        url_username: "{{ ocp_username }}"
        url_password: "{{ ocp_password }}"
        force_basic_auth: true
        validate_certs: false
        follow_redirects: "none"
        headers:
          X-CSRF-Token: "1"
        status_code: [302]
      register: oauth_response
      when: ocp_token == ""
      tags: always

    - name: Set token from OAuth redirect
      ansible.builtin.set_fact:
        k8s_api_key: "{{ oauth_response.location | regex_search('access_token=([^&]+)', '\\1') | first }}"
      when: ocp_token == ""
      tags: always

    - name: Set token from provided ocp_token
      ansible.builtin.set_fact:
        k8s_api_key: "{{ ocp_token }}"
      when: ocp_token != ""
      tags: always

    # -------------------------------------------------------------------------
    # Create Keycloak users via admin API
    # -------------------------------------------------------------------------
    - name: Get Keycloak route for admin API
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: route.openshift.io/v1
        kind: Route
        name: rhdh-keycloak
        namespace: keycloak
      register: keycloak_route_users
      tags: keycloak-users

    - name: Get Keycloak initial admin secret
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: rhdh-keycloak-initial-admin
        namespace: keycloak
      register: keycloak_admin_secret
      tags: keycloak-users

    - name: Set Keycloak admin credentials
      ansible.builtin.set_fact:
        keycloak_host: "https://{{ keycloak_route_users.resources[0].spec.host }}"
        keycloak_admin_user: "{{ keycloak_admin_secret.resources[0].data.username | b64decode }}"
        keycloak_admin_pass: "{{ keycloak_admin_secret.resources[0].data.password | b64decode }}"
      tags: keycloak-users

    - name: Get Keycloak admin token
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ keycloak_admin_user }}"
          password: "{{ keycloak_admin_pass }}"
        validate_certs: false
        status_code: [200]
      register: keycloak_token_response
      tags: keycloak-users

    - name: Set Keycloak admin token fact
      ansible.builtin.set_fact:
        keycloak_admin_token: "{{ keycloak_token_response.json.access_token }}"
      tags: keycloak-users

    - name: Create Keycloak users
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/users"
        method: POST
        body_format: json
        body:
          username: "{{ item.username }}"
          firstName: "{{ item.firstName }}"
          lastName: "{{ item.lastName }}"
          email: "{{ item.email }}"
          enabled: true
          credentials:
            - type: password
              value: "{{ item.password }}"
              temporary: false
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [201, 409]
      loop: "{{ keycloak_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: user_create_results
      tags: keycloak-users

    - name: Get created user IDs
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/users?username={{ item.username }}&exact=true"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      loop: "{{ keycloak_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: user_lookup_results
      tags: keycloak-users

    - name: Get realm role IDs
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/roles"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      register: realm_roles
      tags: keycloak-users

    - name: Assign realm roles to users
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/users/{{ user_lookup_results.results[user_idx].json[0].id }}/role-mappings/realm"
        method: POST
        body_format: json
        body: "{{ realm_roles.json | selectattr('name', 'in', item.roles) | list }}"
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [204]
      loop: "{{ keycloak_users }}"
      loop_control:
        index_var: user_idx
        label: "{{ item.username }}"
      when: user_lookup_results.results[user_idx].json | length > 0
      tags: keycloak-users

    # -------------------------------------------------------------------------
    # Enable service account on developer-hub client (for catalog sync)
    # -------------------------------------------------------------------------
    - name: Get developer-hub client details
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/clients?clientId=developer-hub"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      register: dh_client_result
      tags: keycloak-service-account

    - name: Enable service accounts on developer-hub client
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/clients/{{ dh_client_result.json[0].id }}"
        method: PUT
        body_format: json
        body: "{{ dh_client_result.json[0] | combine({'serviceAccountsEnabled': true}) }}"
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [204]
      tags: keycloak-service-account

    - name: Get developer-hub service account user
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/clients/{{ dh_client_result.json[0].id }}/service-account-user"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      register: sa_user_result
      tags: keycloak-service-account

    - name: Get realm-management client
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/clients?clientId=realm-management"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      register: realm_mgmt_client_result
      tags: keycloak-service-account

    - name: Get realm-management client roles
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/clients/{{ realm_mgmt_client_result.json[0].id }}/roles"
        method: GET
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [200]
      register: realm_mgmt_roles_result
      tags: keycloak-service-account

    - name: Assign view-users/query-users/query-groups roles to service account
      ansible.builtin.uri:
        url: "{{ keycloak_host }}/admin/realms/rhdh/users/{{ sa_user_result.json.id }}/role-mappings/clients/{{ realm_mgmt_client_result.json[0].id }}"
        method: POST
        body_format: json
        body: "{{ realm_mgmt_roles_result.json | selectattr('name', 'in', ['view-users', 'query-users', 'query-groups', 'view-groups']) | list }}"
        headers:
          Authorization: "Bearer {{ keycloak_admin_token }}"
        validate_certs: false
        status_code: [204]
      tags: keycloak-service-account

    # -------------------------------------------------------------------------
    # Wait for Developer Hub PostgreSQL pod to be ready
    # The RHDH operator provisions the developer-hub namespace and PostgreSQL
    # StatefulSet asynchronously after the Backstage CR is synced. ArgoCD may
    # report the app as Healthy before the psql pod is actually Running, so
    # we poll here rather than relying on ArgoCD health alone.
    # -------------------------------------------------------------------------
    - name: Wait for Developer Hub PostgreSQL pod to be Ready
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: v1
        kind: Pod
        name: backstage-psql-developer-hub-0
        namespace: developer-hub
      register: psql_pod_info
      until:
        - psql_pod_info.resources | length > 0
        - psql_pod_info.resources[0].status.phase == "Running"
        - psql_pod_info.resources[0].status.containerStatuses is defined
        - psql_pod_info.resources[0].status.containerStatuses[0].ready == true
      retries: 30
      delay: 20
      tags: keycloak-users

    - name: Wait for Backstage to initialize databases (RHDH deployment ready)
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: apps/v1
        kind: Deployment
        name: backstage-developer-hub
        namespace: developer-hub
      register: rhdh_deploy
      until:
        - rhdh_deploy.resources | length > 0
        - rhdh_deploy.resources[0].status.readyReplicas is defined
        - rhdh_deploy.resources[0].status.readyReplicas >= 1
      retries: 30
      delay: 20
      tags: keycloak-users

    # -------------------------------------------------------------------------
    # Force immediate Keycloak catalog sync in Developer Hub
    # The Keycloak org entity provider runs on a 30-minute schedule with a
    # 30-second initial delay. When post-install runs shortly after startup,
    # that first sync may have already fired with 0 users (before this
    # playbook created them). Backdating next_run_start_at causes the
    # scheduler to pick up the task on its next check cycle (~a few seconds),
    # so users are available for login immediately without waiting 30 minutes.
    # -------------------------------------------------------------------------
    - name: Force immediate Keycloak catalog sync in Developer Hub
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - backstage-psql-developer-hub-0
          - -n
          - developer-hub
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
          - --
          - psql
          - -U
          - postgres
          - -d
          - backstage_plugin_catalog
          - -c
          - >-
            UPDATE backstage_backend_tasks__tasks
            SET next_run_start_at = NOW() - INTERVAL '1 second'
            WHERE id = 'KeycloakOrgEntityProvider:default:refresh';
      changed_when: true
      tags: keycloak-users

    - name: Wait for Keycloak sync to complete and verify users in catalog
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - backstage-psql-developer-hub-0
          - -n
          - developer-hub
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
          - --
          - psql
          - -U
          - postgres
          - -d
          - backstage_plugin_catalog
          - -t
          - -c
          - "SELECT COUNT(*) FROM refresh_state WHERE entity_ref LIKE 'user:%';"
      register: catalog_user_count
      until: (catalog_user_count.stdout | trim | int) > 0
      retries: 6
      delay: 10
      changed_when: false
      tags: keycloak-users

    - name: Report Keycloak catalog sync result
      ansible.builtin.debug:
        msg: "Keycloak sync complete — {{ catalog_user_count.stdout | trim }} user(s) now in catalog"
      tags: keycloak-users

    # -------------------------------------------------------------------------
    # Seal K8S_SERVICE_ACCOUNT_TOKEN for the Kubernetes plugin
    # Creates a long-lived token for the rhdh-k8s-plugin service account,
    # seals it, and commits the updated SealedSecret to git.
    # Usage: --tags k8s-token
    # -------------------------------------------------------------------------
    - name: Create long-lived token for rhdh-k8s-plugin service account
      ansible.builtin.command:
        argv:
          - oc
          - create
          - token
          - rhdh-k8s-plugin
          - --namespace=developer-hub
          - --duration=87600h
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
      register: k8s_sa_token
      tags: k8s-token

    - name: Fetch Sealed Secrets public cert
      ansible.builtin.command:
        argv:
          - oc
          - get
          - secret
          - sealed-secrets-key
          - --namespace=sealed-secrets
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
          - -o
          - jsonpath={.data.tls\.crt}
      register: sealed_cert_b64
      tags: k8s-token

    - name: Write Sealed Secrets cert to temp file
      ansible.builtin.copy:
        content: "{{ sealed_cert_b64.stdout | b64decode }}"
        dest: /tmp/ss_cert.crt
        mode: '0600'
      tags: k8s-token

    - name: Seal K8S_SERVICE_ACCOUNT_TOKEN
      ansible.builtin.shell: |
        printf '%s' "{{ k8s_sa_token.stdout }}" | \
          kubeseal --raw \
            --namespace developer-hub \
            --name backstage-secrets \
            --cert /tmp/ss_cert.crt
      register: sealed_k8s_token
      tags: k8s-token

    - name: Inject sealed token into backstage-secrets-sealed.yaml
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../k8s/developer-hub/instance/backstage-secrets-sealed.yaml"
        regexp: '^\s+K8S_SERVICE_ACCOUNT_TOKEN:.*$'
        replace: "    K8S_SERVICE_ACCOUNT_TOKEN: {{ sealed_k8s_token.stdout }}"
      tags: k8s-token

    - name: Add K8S_SERVICE_ACCOUNT_TOKEN if not present
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../k8s/developer-hub/instance/backstage-secrets-sealed.yaml"
        insertafter: '^\s+ARGOCD_PASSWORD:.*$'
        line: "    K8S_SERVICE_ACCOUNT_TOKEN: {{ sealed_k8s_token.stdout }}"
        regexp: '^\s+K8S_SERVICE_ACCOUNT_TOKEN:.*$'
      tags: k8s-token

    - name: Commit and push updated SealedSecret
      ansible.builtin.shell: |
        cd "{{ playbook_dir }}/../.."
        git add k8s/developer-hub/instance/backstage-secrets-sealed.yaml
        git diff --cached --quiet && echo "no-change" || git commit -m "chore: update sealed K8S_SERVICE_ACCOUNT_TOKEN" && git push
      register: git_k8s_token_push
      changed_when: "'no-change' not in git_k8s_token_push.stdout"
      tags: k8s-token

    - name: Clean up temp cert file
      ansible.builtin.file:
        path: /tmp/ss_cert.crt
        state: absent
      tags: k8s-token

    # -------------------------------------------------------------------------
    # Seal METERING_PROMETHEUS_TOKEN for the metering plugin
    # Creates a long-lived token for the rhdh-metering-prometheus SA (which has
    # cluster-monitoring-view), seals it, and commits to backstage-secrets so
    # the metering backend can authenticate to OpenShift Prometheus.
    # The RHDH pod has automountServiceAccountToken: false (operator hardening)
    # so it cannot use the projected SA token — a named token is required.
    # Usage: --tags metering-prometheus-token
    # -------------------------------------------------------------------------
    - name: Wait for rhdh-metering-prometheus service account to exist
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: v1
        kind: ServiceAccount
        name: rhdh-metering-prometheus
        namespace: developer-hub
      register: metering_sa_info
      until: metering_sa_info.resources | length > 0
      retries: 20
      delay: 15
      tags: metering-prometheus-token

    - name: Create long-lived token for rhdh-metering-prometheus service account
      ansible.builtin.command:
        argv:
          - oc
          - create
          - token
          - rhdh-metering-prometheus
          - --namespace=developer-hub
          - --duration=87600h
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
      register: metering_prometheus_token
      tags: metering-prometheus-token

    - name: Fetch Sealed Secrets public cert for metering token
      ansible.builtin.command:
        argv:
          - oc
          - get
          - secret
          - sealed-secrets-key
          - --namespace=sealed-secrets
          - --server={{ ocp_api_url }}
          - --token={{ k8s_api_key }}
          - --insecure-skip-tls-verify=true
          - -o
          - jsonpath={.data.tls\.crt}
      register: sealed_cert_b64_metering
      tags: metering-prometheus-token

    - name: Write Sealed Secrets cert to temp file for metering token
      ansible.builtin.copy:
        content: "{{ sealed_cert_b64_metering.stdout | b64decode }}"
        dest: /tmp/ss_cert_metering.crt
        mode: '0600'
      tags: metering-prometheus-token

    - name: Seal METERING_PROMETHEUS_TOKEN
      ansible.builtin.shell: |
        printf '%s' "{{ metering_prometheus_token.stdout }}" | \
          kubeseal --raw \
            --namespace developer-hub \
            --name backstage-secrets \
            --cert /tmp/ss_cert_metering.crt
      register: sealed_metering_token
      tags: metering-prometheus-token

    - name: Inject METERING_PROMETHEUS_TOKEN into backstage-secrets-sealed.yaml
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../k8s/developer-hub/instance/backstage-secrets-sealed.yaml"
        regexp: '^\s+METERING_PROMETHEUS_TOKEN:.*$'
        replace: "    METERING_PROMETHEUS_TOKEN: {{ sealed_metering_token.stdout }}"
      tags: metering-prometheus-token

    - name: Add METERING_PROMETHEUS_TOKEN if not present
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../k8s/developer-hub/instance/backstage-secrets-sealed.yaml"
        insertafter: '^\s+K8S_SERVICE_ACCOUNT_TOKEN:.*$'
        line: "    METERING_PROMETHEUS_TOKEN: {{ sealed_metering_token.stdout }}"
        regexp: '^\s+METERING_PROMETHEUS_TOKEN:.*$'
      tags: metering-prometheus-token

    - name: Commit and push sealed METERING_PROMETHEUS_TOKEN
      ansible.builtin.shell: |
        cd "{{ playbook_dir }}/../.."
        git add k8s/developer-hub/instance/backstage-secrets-sealed.yaml
        git diff --cached --quiet && echo "no-change" || git commit -m "chore: update sealed METERING_PROMETHEUS_TOKEN" && git push
      register: git_metering_token_push
      changed_when: "'no-change' not in git_metering_token_push.stdout"
      tags: metering-prometheus-token

    - name: Clean up temp cert file for metering token
      ansible.builtin.file:
        path: /tmp/ss_cert_metering.crt
        state: absent
      tags: metering-prometheus-token

    # -------------------------------------------------------------------------
    # Set ArgoCD rhdh account password
    # Requires the rhdh account to exist (ArgoCD CR must be synced first).
    # argocd_rhdh_password must be defined in vault.yml.
    # Usage: --tags argocd-user
    # -------------------------------------------------------------------------
    - name: Get ArgoCD route
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: route.openshift.io/v1
        kind: Route
        name: openshift-gitops-server
        namespace: openshift-gitops
      register: argocd_route
      tags: argocd-user

    - name: Get ArgoCD admin password from openshift-gitops-cluster secret
      kubernetes.core.k8s_info:
        host: "{{ ocp_api_url }}"
        api_key: "{{ k8s_api_key }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: openshift-gitops-cluster
        namespace: openshift-gitops
      register: argocd_admin_secret
      tags: argocd-user

    - name: Set ArgoCD facts
      ansible.builtin.set_fact:
        argocd_host: "https://{{ argocd_route.resources[0].spec.host }}"
        argocd_admin_password: "{{ argocd_admin_secret.resources[0].data['admin.password'] | b64decode }}"
      tags: argocd-user

    - name: Login to ArgoCD as admin
      ansible.builtin.uri:
        url: "{{ argocd_host }}/api/v1/session"
        method: POST
        body_format: json
        body:
          username: admin
          password: "{{ argocd_admin_password }}"
        validate_certs: false
        status_code: [200]
      register: argocd_session
      tags: argocd-user

    - name: Set ArgoCD session token
      ansible.builtin.set_fact:
        argocd_token: "{{ argocd_session.json.token }}"
      tags: argocd-user

    - name: Set rhdh account password
      ansible.builtin.uri:
        url: "{{ argocd_host }}/api/v1/account/password"
        method: PUT
        body_format: json
        body:
          name: rhdh
          currentPassword: "{{ argocd_admin_password }}"
          newPassword: "{{ argocd_rhdh_password }}"
        headers:
          Authorization: "Bearer {{ argocd_token }}"
        validate_certs: false
        status_code: [200]
      tags: argocd-user

    # -------------------------------------------------------------------------
    # Revoke token
    # -------------------------------------------------------------------------
    - name: Revoke OpenShift OAuth token
      ansible.builtin.uri:
        url: "{{ ocp_oauth_url }}/oauth/token/{{ k8s_api_key }}"
        method: DELETE
        validate_certs: false
        headers:
          Authorization: "Bearer {{ k8s_api_key }}"
        status_code: [200, 201, 204, 404]
      when: k8s_api_key is defined and ocp_token == ""
      tags: always
